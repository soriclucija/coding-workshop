<header class="site-header">
  <span class="site-title">Data Extraction and Coding for Meta-Analysis</span>
  <form class="site-search" role="search" onsubmit="return false;">
    <i class="bi bi-search" aria-hidden="true"></i>
    <input id="site-search-input" type="search" aria-label="Search this page">
    <span id="site-search-count"></span>
  </form>
  <span class="site-copyright">© L. Sorić</span>
</header>

<script>
// In-page search: highlights matches in the main text.
// Enter jumps to the next match, Shift+Enter to the previous one, Esc clears.
document.addEventListener("DOMContentLoaded", function () {
  const input = document.getElementById("site-search-input");
  const count = document.getElementById("site-search-count");
  const main = document.querySelector("main");
  let marks = [];
  let current = -1;

  function clear() {
    marks.forEach(m => m.replaceWith(document.createTextNode(m.textContent)));
    main.normalize();
    marks = [];
    current = -1;
    count.textContent = "";
  }

  function search(term) {
    clear();
    if (term.length < 2) return;
    const lower = term.toLowerCase();
    const walker = document.createTreeWalker(main, NodeFilter.SHOW_TEXT, {
      acceptNode: n =>
        n.parentElement.closest("script, style, iframe, .site-header") ||
        !n.textContent.toLowerCase().includes(lower)
          ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(node => {
      let text = node.textContent, idx;
      const frag = document.createDocumentFragment();
      while ((idx = text.toLowerCase().indexOf(lower)) !== -1) {
        frag.append(text.slice(0, idx));
        const mark = document.createElement("mark");
        mark.className = "search-hit";
        mark.textContent = text.slice(idx, idx + term.length);
        frag.append(mark);
        marks.push(mark);
        text = text.slice(idx + term.length);
      }
      frag.append(text);
      node.replaceWith(frag);
    });
    count.textContent = marks.length ? "" : "0";
    if (marks.length) go(0);
  }

  function go(i) {
    if (!marks.length) return;
    if (current >= 0) marks[current].classList.remove("current");
    current = (i + marks.length) % marks.length;
    marks[current].classList.add("current");
    marks[current].scrollIntoView({ behavior: "smooth", block: "center" });
    count.textContent = (current + 1) + "/" + marks.length;
  }

  let timer;
  input.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(() => search(input.value.trim()), 250);
  });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); go(current + (e.shiftKey ? -1 : 1)); }
    if (e.key === "Escape") { input.value = ""; clear(); }
  });
});
</script>
